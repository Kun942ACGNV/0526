<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <video id="v" autoplay muted playsinline 
    style="width:100%;max-width:400px"></video>
  <div id="msg" style="font-size:24px">載入中...</div>

  <script>
    document.getElementById('msg').textContent = 'JS 有執行';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
      .then(stream => {
        document.getElementById('v').srcObject = stream;
        document.getElementById('msg').textContent = '相機已開啟';
      })
      .catch(err => {
        document.getElementById('msg').textContent = '錯誤：' + err.message;
      });
  </script>
</body>
</html>
