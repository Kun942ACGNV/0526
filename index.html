<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <video id="v" autoplay muted playsinline style="width:100%;max-width:400px"></video>
  <div id="msg" style="font-size:24px">載入中...</div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.js";

    const video = document.getElementById('v');
    const msg = document.getElementById('msg');

    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
    video.srcObject = stream;
    await video.play();

    msg.textContent = 'MediaPipe 載入中...';
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
    );
    const landmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/latest/face_landmarker.task"
      },
      outputFaceBlendshapes: true,
      runningMode: "VIDEO",
      numFaces: 1
    });

    msg.textContent = '準備好了，對著鏡頭微笑！';

    function loop() {
      const result = landmarker.detectForVideo(video, performance.now());
      if (result.faceBlendshapes?.length > 0) {
        const shapes = result.faceBlendshapes[0].categories;
        const smile = shapes.find(s => s.categoryName === 'mouthSmileLeft')?.score ?? 0;
        msg.textContent = '微笑分數：' + Math.round(smile * 100);
      }
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
